<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="title desc">
<title id="title">Shared inputs, two Gaussian reconstruction routes</title>
<desc id="desc">Cabinet photographs, cameras and sparse points branch into 3DGS and 2DGS. Each route initializes elements, repeatedly renders and adjusts them, saves its own representation, and renders new camera views. 2DGS adds surface constraints; its saved disks can also supply depth maps for mesh extraction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#64736c" stroke-width="1.6"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9" fill="none" stroke="#9b772b" stroke-width="1.6"/></marker></defs>
<rect width="1000" height="1240" fill="#fefdfb"/>
<text x="500" y="43" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600" fill="#293632">One set of cabinet photographs, two routes</text>
<text x="500" y="77" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Choose a route; each column fits its own 3D representation.</text>
<rect x="130" y="105" width="740" height="92" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="500" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="600" fill="#293632">1 · Prepare the inputs</text>
<text x="500" y="176" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Photographs + cameras + sparse 3D points (Section 2.7)</text>
<path d="M500 197V216H270V247" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M500 216H730V247" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" fill="#293632">3DGS</text>
<text x="730" y="278" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="600" fill="#293632">2DGS</text>
<rect x="70" y="304" width="400" height="94" rx="7" fill="#fcf4e2" stroke="#cfb674" stroke-width="2"/>
<text x="270" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#293632">2 · Initialize the elements</text>
<text x="270" y="375" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Soft ellipsoids with thickness</text>
<path d="M270 398V428" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="435" width="400" height="316" rx="7" fill="#fefdfb" stroke="#d3ddd8" stroke-width="2"/>
<text x="270" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#293632">3 · Render, compare, adjust</text>
<rect x="105" y="489" width="330" height="76" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="270" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#293632">Use the 3DGS renderer</text>
<text x="270" y="549" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">Render a photographed view</text>
<path d="M270 565V590" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="105" y="597" width="330" height="105" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="270" y="627" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#293632">Compare with the photograph</text>
<text x="270" y="656" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">Adjust using</text>
<text x="270" y="684" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">image differences</text>
<path d="M105 650H86V527H105" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270" y="732" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#293632">Repeat across the camera views</text>
<path d="M270 751V785" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="792" width="400" height="83" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="270" y="824" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#293632">4 · Save the fitted representation</text>
<text x="270" y="855" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Ellipsoids and their parameters</text>
<path d="M270 875V920" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="927" width="400" height="101" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="270" y="960" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#293632">5 · Use: render another view</text>
<text x="270" y="990" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#293632">New camera + corresponding renderer</text>
<text x="270" y="1016" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">→ a new 2D color image</text>
<rect x="530" y="304" width="400" height="94" rx="7" fill="#fcf4e2" stroke="#cfb674" stroke-width="2"/>
<text x="730" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#293632">2 · Initialize the elements</text>
<text x="730" y="375" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Flat disks placed in 3D</text>
<path d="M730 398V428" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="435" width="400" height="316" rx="7" fill="#fefdfb" stroke="#d3ddd8" stroke-width="2"/>
<text x="730" y="470" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#293632">3 · Render, compare, adjust</text>
<rect x="565" y="489" width="330" height="76" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="730" y="520" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#293632">Use the 2DGS renderer</text>
<text x="730" y="549" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">Render a photographed view</text>
<path d="M730 565V590" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="565" y="597" width="330" height="105" rx="7" fill="#fcf4e2" stroke="#cfb674" stroke-width="2"/>
<text x="730" y="627" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#293632">Compare with the photograph</text>
<text x="730" y="656" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#293632">Adjust using image differences</text>
<text x="730" y="684" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#82621c">+ surface constraints</text>
<path d="M565 650H546V527H565" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="730" y="732" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#293632">Repeat across the camera views</text>
<path d="M730 751V785" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="792" width="400" height="83" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="730" y="824" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" fill="#293632">4 · Save the fitted representation</text>
<text x="730" y="855" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Disks and their parameters</text>
<path d="M730 875V920" fill="none" stroke="#64736c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="530" y="927" width="400" height="101" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="730" y="960" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#293632">5 · Use: render another view</text>
<text x="730" y="990" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#293632">New camera + corresponding renderer</text>
<text x="730" y="1016" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">→ a new 2D color image</text>
<path d="M930 834H972V1127H930" fill="none" stroke="#9b772b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#gold-arrow)"/>
<rect x="530" y="1070" width="400" height="127" rx="7" fill="#fcf4e2" stroke="#cfb674" stroke-width="2"/>
<text x="730" y="1102" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#293632">Optional: extract a mesh</text>
<text x="730" y="1133" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">Saved disks → render depth maps</text>
<text x="730" y="1163" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#293632">Combine depth → extract surfaces</text>
<rect x="70" y="1084" width="20" height="20" rx="7" fill="#f3f7f5" stroke="#d3ddd8" stroke-width="2"/>
<text x="282" y="1101" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Shared operation</text>
<rect x="70" y="1122" width="20" height="20" rx="7" fill="#fcf4e2" stroke="#cfb674" stroke-width="2"/>
<text x="282" y="1139" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#293632">Method-specific detail</text>
<text x="270" y="1180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#293632">A 3DGS mesh uses an additional</text>
<text x="270" y="1207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#293632">surface-reconstruction workflow.</text>
<text x="730" y="1225" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#293632">Surface constraints guide depth and facing direction.</text>
</svg>
