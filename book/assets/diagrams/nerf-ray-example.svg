<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" role="img"><title>A camera ray is sampled in empty space, near a blue front panel, and behind the panel to calculate one pixel</title><style>text{font-family:Arial,sans-serif;fill:#333b3a;font-size:24px}</style>
