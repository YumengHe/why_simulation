<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img"><title>Tangent, normal, and curvature on the cylindrical grip</title><rect width="600" height="430" fill="#fefdfb"/><g font-family="Arial, sans-serif"><text x="24" y="31" font-size="15" fill="#a87a20" text-anchor="start" font-weight="400">03 · SURFACE ANALYSIS</text><text x="24" y="69" font-size="27" fill="#292b29" text-anchor="start" font-weight="600">Ask which way the surface faces</text><circle cx="200.0" cy="230.0" r="90" fill="#e2ecea" stroke="#528682" stroke-width="2"/><polyline points="200.00,230.00 254.00,158.00" fill="none" stroke="#528682" stroke-width="2" stroke-dasharray="6 5"/><polyline points="254.00,158.00 311.00,82.00" fill="none" stroke="#4e83a7" stroke-width="2"/><polyline points="308.20,92.40 311.00,82.00 301.80,87.60" fill="none" stroke="#4e83a7" stroke-width="2"/><polyline points="194.00,113.00 330.00,215.00" fill="none" stroke="#a87a20" stroke-width="2"/><polyline points="319.60,212.20 330.00,215.00 324.40,205.80" fill="none" stroke="#a87a20" stroke-width="2"/><circle cx="254.0" cy="158.0" r="5" fill="#a87a20" stroke="#a87a20" stroke-width="2"/><text x="340" y="127" font-size="21" fill="#4e83a7" text-anchor="start" font-weight="400">Normal</text><text x="340" y="155" font-size="17" fill="#69675f" text-anchor="start" font-weight="400">Points outward</text><text x="347" y="225" font-size="21" fill="#a87a20" text-anchor="start" font-weight="400">Tangent</text><text x="347" y="253" font-size="17" fill="#69675f" text-anchor="start" font-weight="400">Runs along the surface</text><text x="300" y="370" font-size="20" fill="#292b29" text-anchor="middle" font-weight="400">Around the grip: curvature = 1 / radius</text><text x="300" y="402" font-size="18" fill="#69675f" text-anchor="middle" font-weight="400">Along its straight axis: curvature = 0</text></g></svg>